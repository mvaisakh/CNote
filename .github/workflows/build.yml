name: Cross-Platform Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmupdf-dev libgl1-mesa-dev libxkbcommon-dev

    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install mupdf

    - name: Cache MuPDF
      id: cache-mupdf
      uses: actions/cache@v4
      with:
        path: third_party/mupdf
        key: ${{ runner.os }}-mupdf-1.27.2

    - name: Build MuPDF (Windows)
      if: matrix.os == 'windows-latest' && steps.cache-mupdf.outputs.cache-hit != 'true'
      run: |
        curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
        tar -xzf mupdf.tar.gz
        cd mupdf-1.27.2-source
        msbuild platform/win32/mupdf.sln /p:Configuration=Release /p:Platform=x64
        cd ..
        mkdir -p third_party/mupdf/include
        mkdir -p third_party/mupdf/lib
        cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
        cp mupdf-1.27.2-source/platform/win32/x64/Release/libmupdf.lib third_party/mupdf/lib/mupdf.lib

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
        target: 'desktop'
        arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || matrix.os == 'macos-latest' && 'clang_64' || 'gcc_64' }}

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        VERSION=$(cat VERSION.txt | tr -d '\n')
        cp build/CNotes CeriumNotes-${VERSION}
        tar -czf CeriumNotes-${VERSION}.tar.gz CeriumNotes-${VERSION}
        echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}.tar.gz" >> $GITHUB_ENV

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $VERSION = Get-Content VERSION.txt -Raw
        $VERSION = $VERSION.Trim()
        Copy-Item build/CNotes.exe -Destination CeriumNotes-$VERSION.exe
        Compress-Archive -Path CeriumNotes-$VERSION.exe -DestinationPath CeriumNotes-$VERSION.zip
        echo "RELEASE_ARTIFACT=CeriumNotes-$VERSION.zip" >> $env:GITHUB_ENV

    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        VERSION=$(cat VERSION.txt | tr -d '\n')
        mv build/CNotes.app CeriumNotes-${VERSION}.app
        zip -r CeriumNotes-${VERSION}-macOS.zip CeriumNotes-${VERSION}.app
        echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}-macOS.zip" >> $GITHUB_ENV

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-${{ matrix.platform }}
        path: |
          *.tar.gz
          *.zip

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmupdf-dev

    - name: Cache MuPDF (Android)
      id: cache-mupdf-android
      uses: actions/cache@v4
      with:
        path: third_party/mupdf
        key: android-mupdf-1.27.2

    - name: Build MuPDF (Android)
      if: steps.cache-mupdf-android.outputs.cache-hit != 'true'
      run: |
        curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
        tar -xzf mupdf.tar.gz
        cd mupdf-1.27.2-source
        $ANDROID_NDK_ROOT/ndk-build -C platform/android -j$(nproc) APP_ABI=arm64-v8a
        cd ..
        mkdir -p third_party/mupdf/include
        mkdir -p third_party/mupdf/lib
        cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
        cp mupdf-1.27.2-source/platform/android/obj/local/arm64-v8a/libmupdf.a third_party/mupdf/lib/

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        target: 'android'
        arch: 'android_arm64_v8a'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      run: |
        sdkmanager "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build-android -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-34

    - name: Build APK
      run: cmake --build build-android --target apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-android
        path: build-android/android-build/build/outputs/apk/release/*.apk

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache MuPDF (iOS)
      id: cache-mupdf-ios
      uses: actions/cache@v4
      with:
        path: third_party/mupdf
        key: ios-mupdf-1.27.2

    - name: Build MuPDF (iOS)
      if: steps.cache-mupdf-ios.outputs.cache-hit != 'true'
      run: |
        curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
        tar -xzf mupdf.tar.gz
        cd mupdf-1.27.2-source
        xcodebuild -project platform/ios/mupdf.xcodeproj -scheme libmupdf -configuration Release -sdk iphoneos ARCHS=arm64
        cd ..
        mkdir -p third_party/mupdf/include
        mkdir -p third_party/mupdf/lib
        cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
        cp mupdf-1.27.2-source/platform/ios/build/Release-iphoneos/libmupdf.a third_party/mupdf/lib/

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        target: 'ios'

    - name: Configure CMake
      run: |
        cmake -B build-ios -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

    - name: Build
      run: cmake --build build-ios --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-ios
        path: build-ios/Release-iphoneos/*.ipa

  release:
    name: Create Pre-Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Tag
      id: tag
      run: |
        VERSION=$(cat VERSION.txt | tr -d '\n')
        SHA=$(git rev-parse --short HEAD)
        TAG="${VERSION}-${SHA}"
        echo "TAG=${TAG}" >> $GITHUB_ENV
        echo "tag=${TAG}" >> $GITHUB_OUTPUT

    - name: Download All Artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG }}
        name: CeriumNotes ${{ env.TAG }} Pre-Release
        prerelease: true
        files: |
          CeriumNotes-*/*
