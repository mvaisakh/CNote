name: Cross-Platform Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmupdf-dev libgl1-mesa-dev libxkbcommon-dev

    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install mupdf

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        curl -L -A "Mozilla/5.0" https://mupdf.com/downloads/mupdf-1.24.1-windows-lib.zip -o mupdf.zip
        expand-archive mupdf.zip -destinationpath third_party/mupdf
        move third_party/mupdf/mupdf-1.24.1-windows-lib/* third_party/mupdf/

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
        target: 'desktop'
        arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || matrix.os == 'macos-latest' && 'clang_64' || 'gcc_64' }}

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        VERSION=$(cat VERSION.txt | tr -d '\n')
        cp build/CNotes CeriumNotes-${VERSION}
        tar -czf CeriumNotes-${VERSION}.tar.gz CeriumNotes-${VERSION}
        echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}.tar.gz" >> $GITHUB_ENV

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $VERSION = Get-Content VERSION.txt -Raw
        $VERSION = $VERSION.Trim()
        Copy-Item build/CNotes.exe -Destination CeriumNotes-$VERSION.exe
        Compress-Archive -Path CeriumNotes-$VERSION.exe -DestinationPath CeriumNotes-$VERSION.zip
        echo "RELEASE_ARTIFACT=CeriumNotes-$VERSION.zip" >> $env:GITHUB_ENV

    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        VERSION=$(cat VERSION.txt | tr -d '\n')
        mv build/CNotes.app CeriumNotes-${VERSION}.app
        zip -r CeriumNotes-${VERSION}-macOS.zip CeriumNotes-${VERSION}.app
        echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}-macOS.zip" >> $GITHUB_ENV

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-${{ matrix.platform }}
        path: |
          *.tar.gz
          *.zip

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmupdf-dev

    - name: Install MuPDF for Android
      run: |
        mkdir -p third_party/mupdf
        curl -L -A "Mozilla/5.0" https://mupdf.com/downloads/mupdf-1.24.1-android-lib.zip -o mupdf-android.zip
        unzip mupdf-android.zip -d third_party/mupdf
        mv third_party/mupdf/mupdf-1.24.1-android-lib/* third_party/mupdf/

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        target: 'android'
        arch: 'android_arm64_v8a'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      run: |
        sdkmanager "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build-android -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-34

    - name: Build APK
      run: cmake --build build-android --target apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-android
        path: build-android/android-build/build/outputs/apk/release/*.apk

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install MuPDF for iOS
      run: |
        mkdir -p third_party/mupdf
        curl -L -A "Mozilla/5.0" https://mupdf.com/downloads/mupdf-1.24.1-ios-lib.zip -o mupdf-ios.zip
        unzip mupdf-ios.zip -d third_party/mupdf
        mv third_party/mupdf/mupdf-1.24.1-ios-lib/* third_party/mupdf/

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        target: 'ios'

    - name: Configure CMake
      run: |
        cmake -B build-ios -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

    - name: Build
      run: cmake --build build-ios --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-ios
        path: build-ios/Release-iphoneos/*.ipa

  release:
    name: Create Pre-Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Tag
      id: tag
      run: |
        VERSION=$(cat VERSION.txt | tr -d '\n')
        SHA=$(git rev-parse --short HEAD)
        TAG="${VERSION}-${SHA}"
        echo "TAG=${TAG}" >> $GITHUB_ENV
        echo "tag=${TAG}" >> $GITHUB_OUTPUT

    - name: Download All Artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG }}
        name: CeriumNotes ${{ env.TAG }} Pre-Release
        prerelease: true
        files: |
          CeriumNotes-*/*
