# CeriumNotes CI Overhaul v3
name: Cross-Platform Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }} - ${{ matrix.target_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target_arch: [x64]
        include:
          - os: macos-latest
            platform: macos
            target_arch: arm64
          - os: macos-latest
            platform: macos
            target_arch: x86_64
          - os: ubuntu-latest
            platform: linux
            target_arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            target_arch: arm64
          - os: windows-latest
            platform: windows
            target_arch: x64

    container:
      image: ${{ matrix.platform == 'linux' && 'fedora:rawhide' || '' }}
    
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies (Linux Fedora)
        if: matrix.platform == 'linux'
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            gcc-c++ \
            pkgconf-pkg-config \
            git \
            tar \
            which \
            mesa-libGL-devel \
            libxkbcommon-devel \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtsvg-devel \
            qt6-qt5compat-devel \
            mupdf-devel

      - name: Cache MuPDF (macOS)
        id: cache-mupdf-macos
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: ${{ runner.os }}-${{ matrix.target_arch }}-mupdf-1.27.2-v2

      - name: Build MuPDF (macOS)
        if: matrix.os == 'macos-latest' && steps.cache-mupdf-macos.outputs.cache-hit != 'true'
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          tar -xzf mupdf.tar.gz
          cd mupdf-1.27.2-source
          make -j$(sysctl -n hw.ncpu) libs HAVE_X11=no HAVE_GLUT=no OS=macos \
            XCFLAGS="-arch ${{ matrix.target_arch }}" \
            XLDFLAGS="-arch ${{ matrix.target_arch }}"
          cd ..
          mkdir -p third_party/mupdf/include
          mkdir -p third_party/mupdf/lib
          cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
          find mupdf-1.27.2-source/build -name "*.a" -exec cp {} third_party/mupdf/lib/ \;


      - id: cache-mupdf
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: ${{ runner.os }}-${{ matrix.target_arch }}-mupdf-1.27.2-v2

      - name: Setup MSBuild
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Build MuPDF (Windows)
        if: matrix.os == 'windows-latest' && steps.cache-mupdf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          python -c "import tarfile; tar = tarfile.open('mupdf.tar.gz'); tar.extractall(); tar.close()"
          cd mupdf-1.27.2-source
          msbuild platform/win32/mupdf.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:NoHyphen=1
          cd ..
          New-Item -ItemType Directory -Force -Path third_party/mupdf/include
          New-Item -ItemType Directory -Force -Path third_party/mupdf/lib
          Copy-Item -Path mupdf-1.27.2-source/include/* -Destination third_party/mupdf/include/ -Recurse
          Copy-Item -Path mupdf-1.27.2-source/platform/win32/x64/Release/libmupdf.lib -Destination third_party/mupdf/lib/mupdf.lib

      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $WORKSPACE = "${{ runner.workspace }}".Replace('\', '/')
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --outputdir $WORKSPACE/Qt
          echo "Qt6_DIR=$WORKSPACE/Qt/6.8.0/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Qt (macOS/iOS/Android)
        if: matrix.platform != 'linux' && matrix.os != 'windows-latest'
        run: |
          python3 -m pip install aqtinstall --break-system-packages
          if [ "${{ matrix.platform }}" == "ios" ]; then
            python3 -m aqt install-qt mac desktop 6.8.0 clang_64 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
            python3 -m aqt install-qt mac ios 6.8.0 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
            echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/ios" >> $GITHUB_ENV
            echo "QT_HOST_PATH=${{ runner.workspace }}/Qt/6.8.0/macos" >> $GITHUB_ENV
          elif [ "${{ matrix.platform }}" == "android" ]; then
            python3 -m aqt install-qt linux desktop 6.8.0 linux_gcc_64 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
            python3 -m aqt install-qt linux android 6.8.0 android_arm64_v8a -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
            echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/android_arm64_v8a" >> $GITHUB_ENV
            echo "QT_HOST_PATH=${{ runner.workspace }}/Qt/6.8.0/gcc_64" >> $GITHUB_ENV
          else
            python3 -m aqt install-qt mac desktop 6.8.0 clang_64 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
            echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/macos" >> $GITHUB_ENV
          fi

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            "$Qt6_DIR/bin/qt-cmake.bat" -B build -G "Visual Studio 17 2022" -A x64 \
              -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
              ${{ matrix.os == 'macos-latest' && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.target_arch) || '' }}
          fi

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\n')
          cp build/CeriumNotes CeriumNotes-${VERSION}
          tar -czf CeriumNotes-${VERSION}.tar.gz CeriumNotes-${VERSION}
          echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = Get-Content VERSION.txt -Raw
          $VERSION = $VERSION.Trim()
          Copy-Item build/Release/CeriumNotes.exe -Destination CeriumNotes-$VERSION.exe
          Compress-Archive -Path CeriumNotes-$VERSION.exe -DestinationPath CeriumNotes-$VERSION.zip
          echo "RELEASE_ARTIFACT=CeriumNotes-$VERSION.zip" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\n')
          APP_PATH=$(find build -name "*.app" | head -n 1)
          mv build/CeriumNotes.app CeriumNotes-$VERSION-${{ matrix.target_arch }}.app
          zip -r CeriumNotes-${VERSION}-${{ matrix.target_arch }}-macOS.zip CeriumNotes-${VERSION}-${{ matrix.target_arch }}.app
          echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}-${{ matrix.target_arch }}-macOS.zip" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CeriumNotes-${{ matrix.platform }}-${{ matrix.target_arch }}
          path: |
            *.tar.gz
            *.zip

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    container: fedora:rawhide
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          dnf install -y \
            cmake \
            ninja-build \
            gcc-c++ \
            git \
            tar \
            which \
            java-latest-openjdk-devel \
            python3-pip

      - name: Cache MuPDF (Android)
        id: cache-mupdf-android
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: android-mupdf-1.27.2-v2

      - name: Build MuPDF (Android)
        if: steps.cache-mupdf-android.outputs.cache-hit != 'true'
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          tar -xzf mupdf.tar.gz
          cd mupdf-1.27.2-source
          make -j$(nproc) libs HAVE_X11=no HAVE_GLUT=no OS=android ARCH=arm64
          cd ..
          mkdir -p third_party/mupdf/include
          mkdir -p third_party/mupdf/lib
          cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
          find mupdf-1.27.2-source/build -name "*.a" -exec cp {} third_party/mupdf/lib/ \;

      - name: Install Qt (Android)
        run: |
          python3 -m pip install aqtinstall --break-system-packages
          python3 -m aqt install-qt linux desktop 6.8.0 linux_gcc_64 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
          python3 -m aqt install-qt linux android 6.8.0 android_arm64_v8a -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
          echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/android_arm64_v8a" >> $GITHUB_ENV
          echo "QT_HOST_PATH=${{ runner.workspace }}/Qt/6.8.0/gcc_64" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          ls -R third_party/mupdf || true
          ${{ env.Qt6_DIR }}/bin/qt-cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DANDROID_NDK_ROOT=${{ env.ANDROID_NDK_ROOT }} \
            -DQT_HOST_PATH=${{ env.QT_HOST_PATH }} \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

      - name: Build APK
        run: cmake --build build --target apk --config Release

      - name: Sign APK (Self-Signed)
        run: |
          keytool -genkey -v -keystore temp.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias temp-key -keypass password -storepass password \
            -dname "CN=CeriumNotes, OU=Cerium, O=Cerium, L=Earth, S=Earth, C=Earth"
          
          UNSIGNED_APK=$(find build/android-build/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Signing $UNSIGNED_APK..."
          
          apksigner sign --ks temp.jks --ks-pass pass:password --ks-key-alias temp-key --key-pass pass:password \
            --out build/android-build/build/outputs/apk/release/CeriumNotes-Signed.apk \
            "$UNSIGNED_APK"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeriumNotes-android
          path: build/android-build/build/outputs/apk/release/CeriumNotes-Signed.apk

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MuPDF (iOS)
        id: cache-mupdf-ios
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: ios-mupdf-1.27.2-v2

      - name: Build MuPDF (iOS)
        if: steps.cache-mupdf-ios.outputs.cache-hit != 'true'
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          tar -xzf mupdf.tar.gz
          cd mupdf-1.27.2-source
          make -j$(sysctl -n hw.ncpu) libs OS=ios ARCH=arm64 \
            CC="$(xcrun -sdk iphoneos -find clang) -isysroot $(xcrun -sdk iphoneos --show-sdk-path)" \
            AR="$(xcrun -sdk iphoneos -find ar)" \
            RANLIB="$(xcrun -sdk iphoneos -find ranlib)"
          cd ..
          mkdir -p third_party/mupdf/include
          mkdir -p third_party/mupdf/lib
          cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
          find mupdf-1.27.2-source/build -name "*.a" -exec cp {} third_party/mupdf/lib/ \;

      - name: Install Qt (iOS)
        run: |
          python3 -m pip install aqtinstall --break-system-packages
          python3 -m aqt install-qt mac desktop 6.8.0 clang_64 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
          python3 -m aqt install-qt mac ios 6.8.0 -m qt5compat qtshadertools --outputdir ${{ runner.workspace }}/Qt
          echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/ios" >> $GITHUB_ENV
          echo "QT_HOST_PATH=${{ runner.workspace }}/Qt/6.8.0/macos" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          ls -R third_party/mupdf || true
          ${{ env.Qt6_DIR }}/bin/qt-cmake -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH=${{ env.QT_HOST_PATH }}

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeriumNotes-ios
          path: build/Release-iphoneos/*.ipa

  release:
    name: Create Pre-Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag
        id: tag
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\n')
          SHA=$(git rev-parse --short HEAD)
          TAG="${VERSION}-${SHA}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: CeriumNotes ${{ env.TAG }} Pre-Release
          prerelease: true
          files: |
            CeriumNotes-*/*
