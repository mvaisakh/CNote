name: Cross-Platform Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }} - ${{ matrix.target_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        target_arch: [x64]
        include:
          - os: macos-latest
            platform: macos
            target_arch: arm64
          - os: macos-latest
            platform: macos
            target_arch: x86_64
          - os: ubuntu-latest
            platform: linux
            target_arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            target_arch: arm64
          - os: windows-latest
            platform: windows
            target_arch: x64
          - os: windows-latest
            platform: windows
            target_arch: arm64

    container:
      image: ${{ matrix.platform == 'linux' && 'fedora:rawhide' || '' }}
    
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies (Linux Fedora)
        if: matrix.platform == 'linux'
        run: |
          dnf install -y dnf-plugins-core
          dnf install -y \
            cmake \
            ninja-build \
            gcc-c++ \
            pkgconf-pkg-config \
            mesa-libGL-devel \
            libxkbcommon-devel \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtsvg-devel \
            mupdf-devel

      - name: Cache MuPDF (macOS)
        id: cache-mupdf-macos
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: ${{ runner.os }}-${{ matrix.target_arch }}-mupdf-1.27.2

      - name: Build MuPDF (macOS)
        if: matrix.os == 'macos-latest' && steps.cache-mupdf-macos.outputs.cache-hit != 'true'
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          tar -xzf mupdf.tar.gz
          cd mupdf-1.27.2-source
          make -j$(sysctl -n hw.ncpu) libs HAVE_X11=no HAVE_GLUT=no OS=macos \
            XCFLAGS="-arch ${{ matrix.target_arch }}" \
            XLDFLAGS="-arch ${{ matrix.target_arch }}"
          cd ..
          mkdir -p third_party/mupdf/include
          mkdir -p third_party/mupdf/lib
          cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
          cp mupdf-1.27.2-source/build/release/*.a third_party/mupdf/lib/

      - name: Setup MSBuild
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2


      - id: cache-mupdf
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: ${{ runner.os }}-${{ matrix.target_arch }}-mupdf-1.27.2

      - name: Setup MSBuild
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Build MuPDF (Windows)
        if: matrix.os == 'windows-latest' && steps.cache-mupdf.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          python -c "import tarfile; tar = tarfile.open('mupdf.tar.gz'); tar.extractall(); tar.close()"
          cd mupdf-1.27.2-source
          $MS_PLATFORM = if ("${{ matrix.target_arch }}" -eq "arm64") { "ARM64" } else { "x64" }
          if ("${{ matrix.target_arch }}" -eq "arm64") {
            $env:CL = "/DFZ_ENABLE_HYPHENATION=0 /DFZ_ENABLE_HYPHEN=0"
          }
          msbuild platform/win32/mupdf.sln /p:Configuration=Release /p:Platform=$MS_PLATFORM /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:NoHyphen=1
          cd ..
          New-Item -ItemType Directory -Force -Path third_party/mupdf/include
          New-Item -ItemType Directory -Force -Path third_party/mupdf/lib
          Copy-Item -Path mupdf-1.27.2-source/include/* -Destination third_party/mupdf/include/ -Recurse
          $LIB_DIR = if ("${{ matrix.target_arch }}" -eq "arm64") { "ARM64" } else { "x64" }
          Copy-Item -Path mupdf-1.27.2-source/platform/win32/$LIB_DIR/Release/libmupdf.lib -Destination third_party/mupdf/lib/mupdf.lib

      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m pip install aqtinstall
          if ("${{ matrix.target_arch }}" -eq "arm64") {
            python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --outputdir ${{ runner.workspace }}/Qt
            python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_arm64_cross_compiled --outputdir ${{ runner.workspace }}/Qt
            echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/msvc2022_arm64" >> $env:GITHUB_ENV
          } else {
            python -m aqt install-qt windows desktop 6.8.0 win64_msvc2022_64 --outputdir ${{ runner.workspace }}/Qt
            echo "Qt6_DIR=${{ runner.workspace }}/Qt/6.8.0/msvc2022_64" >> $env:GITHUB_ENV
          }
        shell: pwsh

      - name: Install Qt (Other)
        if: matrix.os != 'windows-latest' && (matrix.platform != 'linux' || matrix.target_arch != 'arm64')
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          host: ${{ matrix.os == 'macos-latest' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ matrix.os == 'macos-latest' && 'clang_64' || 'linux_gcc_64' }}

      - name: Install Qt (Linux ARM64 Apt)
        if: matrix.platform == 'linux' && matrix.target_arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev libqt6svg6-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.os == 'macos-latest' && format('-DCMAKE_OSX_ARCHITECTURES={0}', matrix.target_arch) || '' }}

      - name: Build
        run: cmake --build build

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\n')
          cp build/CNotes CeriumNotes-${VERSION}
          tar -czf CeriumNotes-${VERSION}.tar.gz CeriumNotes-${VERSION}
          echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $VERSION = Get-Content VERSION.txt -Raw
          $VERSION = $VERSION.Trim()
          Copy-Item build/CNotes.exe -Destination CeriumNotes-$VERSION.exe
          Compress-Archive -Path CeriumNotes-$VERSION.exe -DestinationPath CeriumNotes-$VERSION.zip
          echo "RELEASE_ARTIFACT=CeriumNotes-$VERSION.zip" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\n')
          APP_PATH=$(find build -name "*.app" | head -n 1)
          mv build/CeriumNotes.app CeriumNotes-$VERSION-${{ matrix.target_arch }}.app
          zip -r CeriumNotes-${VERSION}-${{ matrix.target_arch }}-macOS.zip CeriumNotes-${VERSION}-${{ matrix.target_arch }}.app
          echo "RELEASE_ARTIFACT=CeriumNotes-${VERSION}-${{ matrix.target_arch }}-macOS.zip" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CeriumNotes-${{ matrix.platform }}-${{ matrix.target_arch }}
          path: |
            *.tar.gz
            *.zip

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libmupdf-dev

      - name: Cache MuPDF (Android)
        id: cache-mupdf-android
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: android-mupdf-1.27.2

      - name: Build MuPDF (Android)
        if: steps.cache-mupdf-android.outputs.cache-hit != 'true'
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          tar -xzf mupdf.tar.gz
          cd mupdf-1.27.2-source
          make -j$(nproc) libs HAVE_X11=no HAVE_GLUT=no OS=android ARCH=arm64
          cd ..
          mkdir -p third_party/mupdf/include
          mkdir -p third_party/mupdf/lib
          cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
          cp mupdf-1.27.2-source/build/release/*.a third_party/mupdf/lib/

      - name: Install Qt (Host)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'desktop'
      - name: Save Host Qt Path
        run: echo "QT_HOST_PATH_DIR=${Qt6_DIR%/lib/cmake/Qt6}" >> $GITHUB_ENV

      - name: Install Qt (Android)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DQt6_DIR=$Qt6_DIR/lib/cmake/Qt6 \
            -DQT_HOST_PATH=$QT_HOST_PATH_DIR \
            -DQT_ANDROID_BUILD_ALL_ABIS=OFF

      - name: Build APK
        run: cmake --build build-android --target apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeriumNotes-android
          path: build-android/android-build/build/outputs/apk/release/*.apk

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache MuPDF (iOS)
        id: cache-mupdf-ios
        uses: actions/cache@v4
        with:
          path: third_party/mupdf
          key: ios-mupdf-1.27.2

      - name: Build MuPDF (iOS)
        if: steps.cache-mupdf-ios.outputs.cache-hit != 'true'
        run: |
          curl -L https://casper.mupdf.com/downloads/archive/mupdf-1.27.2-source.tar.gz -o mupdf.tar.gz
          tar -xzf mupdf.tar.gz
          cd mupdf-1.27.2-source
          make -j$(sysctl -n hw.ncpu) libs OS=ios ARCH=arm64 \
            CC="$(xcrun -sdk iphoneos -find clang) -isysroot $(xcrun -sdk iphoneos --show-sdk-path)" \
            AR="$(xcrun -sdk iphoneos -find ar)" \
            RANLIB="$(xcrun -sdk iphoneos -find ranlib)"
          cd ..
          mkdir -p third_party/mupdf/include
          mkdir -p third_party/mupdf/lib
          cp -r mupdf-1.27.2-source/include/* third_party/mupdf/include/
          cp mupdf-1.27.2-source/build/release/*.a third_party/mupdf/lib/

      - name: Install Qt (Host)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'desktop'
      - name: Save Host Qt Path
        run: echo "QT_HOST_PATH_DIR=${Qt6_DIR%/lib/cmake/Qt6}" >> $GITHUB_ENV

      - name: Install Qt (iOS)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          target: 'ios'

      - name: Configure CMake
        run: |
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DQt6_DIR=$Qt6_DIR/lib/cmake/Qt6 \
            -DQT_HOST_PATH=$QT_HOST_PATH_DIR

      - name: Build
        run: cmake --build build-ios --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeriumNotes-ios
          path: build-ios/Release-iphoneos/*.ipa

  release:
    name: Create Pre-Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Tag
        id: tag
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\n')
          SHA=$(git rev-parse --short HEAD)
          TAG="${VERSION}-${SHA}"
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: CeriumNotes ${{ env.TAG }} Pre-Release
          prerelease: true
          files: |
            CeriumNotes-*/*
