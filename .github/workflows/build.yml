name: Cross-Platform Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libmupdf-dev libgl1-mesa-dev libxkbcommon-dev

    - name: Install Dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install mupdf

    - name: Install Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        vcpkg install mupdf:x64-windows

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        host: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
        target: 'desktop'
        arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || matrix.os == 'macos-latest' && 'clang_64' || 'gcc_64' }}

    - name: Configure CMake
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.os == 'windows-latest' && '$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake' || '' }}

    - name: Build
      run: cmake --build build

    - name: Package (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        VERSION=$(cmake -LA build | grep "APP_VERSION_STR:STRING" | cut -d'=' -f2)
        cp build/CNotes CeriumNotes-${VERSION}
        tar -czf CeriumNotes-${VERSION}.tar.gz CeriumNotes-${VERSION}

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $VERSION = (cmake -LA build | Select-String "APP_VERSION_STR:STRING").ToString().Split('=')[1]
        Copy-Item build/CNotes.exe -Destination CeriumNotes-$VERSION.exe
        Compress-Archive -Path CeriumNotes-$VERSION.exe -DestinationPath CeriumNotes-$VERSION.zip

    - name: Package (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        VERSION=$(cmake -LA build | grep "APP_VERSION_STR:STRING" | cut -d'=' -f2)
        mv build/CNotes.app CeriumNotes-${VERSION}.app
        zip -r CeriumNotes-${VERSION}-macOS.zip CeriumNotes-${VERSION}.app

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-${{ matrix.platform }}
        path: |
          *.tar.gz
          *.zip

  build-android:
    name: Build (Android)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmupdf-dev

    - name: Install MuPDF via vcpkg
      run: |
        vcpkg install mupdf:arm64-android

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        target: 'android'
        arch: 'android_arm64_v8a'

    - name: Setup Android NDK
      uses: n0rt3n/setup-android-sdk-ndk@v1
      with:
        ndk-version: '25.2.9519653'

    - name: Configure CMake
      run: |
        cmake -B build-android -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-android \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-34

    - name: Build APK
      run: cmake --build build-android --target apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-android
        path: build-android/android-build/build/outputs/apk/release/*.apk

  build-ios:
    name: Build (iOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install MuPDF via vcpkg
      run: |
        vcpkg install mupdf:arm64-ios

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        target: 'ios'

    - name: Configure CMake
      run: |
        cmake -B build-ios -G Xcode \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

    - name: Build
      run: cmake --build build-ios --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CeriumNotes-ios
        path: build-ios/Release-iphoneos/*.ipa

  release:
    name: Create Pre-Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate Tag
      id: tag
      run: |
        VERSION=$(cat version | tr -d '\n')
        SHA=$(git rev-parse --short HEAD)
        TAG="${VERSION}-${SHA}"
        echo "TAG=${TAG}" >> $GITHUB_ENV
        echo "tag=${TAG}" >> $GITHUB_OUTPUT

    - name: Download All Artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG }}
        name: CeriumNotes ${{ env.TAG }} Pre-Release
        prerelease: true
        files: |
          CeriumNotes-*/*
